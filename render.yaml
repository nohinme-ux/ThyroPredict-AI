services:
  # 1. FastAPI Machine Learning Backend Service
  - type: web
    name: thyropredict-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: thyropredict-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://thyropredict-ui.onrender.com"

  # 2. React + Vite Static Frontend
  - type: web
    name: thyropredict-ui
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://thyropredict-backend.onrender.com/api"

databases:
  # 3. Managed Persistent PostgreSQL Database
  - name: thyropredict-db
    databaseName: thyropredict
    user: thyropredict_user
    plan: free
    region: oregon
