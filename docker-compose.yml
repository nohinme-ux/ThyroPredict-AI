version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thyropredict-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/thyropredict.db
      - SECRET_KEY=thyropredict-production-secret-key-change-me
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thyropredict-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
